<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vee Collection | Your Style, Your Confidence</title>

  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vee Collection" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { 400: '#D4AF37', 500: '#C5A028', 600: '#B08D1E' },
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #050505; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

    @keyframes fadeInZoom {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-splash {
      animation: fadeInZoom 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen selection:bg-yellow-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    
    let supabase = null;
    if (SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL" && window.supabase) {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const DEFAULT_CONFIG = {
      whatsappNumber: '254762089797',
      mpesaTill: '8221168',
      storeName: 'Vee Collection',
      tagline: 'Your Style, Your Confidence.'
    };

    const CATEGORIES = [
      { id: 'all', name: 'All Collection' },
      { id: 'ladies', name: "Ladies' Clothes" },
      { id: 'dresses', name: 'Dresses' },
      { id: 'tops', name: 'Tops & Blouses' },
      { id: 'trousers', name: 'Trousers & Jeans' },
      { id: 'skirts', name: 'Skirts' },
      { id: 'jackets', name: 'Jackets & Sweaters' },
      { id: 'men', name: "Men's Clothing" },
      { id: 'children', name: "Children's Clothing" },
      { id: 'shoes-accessories', name: 'Shoes & Accessories' }
    ];

    const COUNTIES = [
      { name: 'Nairobi CBD & Environs', fee: 200 },
      { name: 'Nairobi Outer Suburbs', fee: 350 },
      { name: 'Mombasa', fee: 450 },
      { name: 'Kisumu', fee: 400 },
      { name: 'Nakuru', fee: 350 },
      { name: 'Eldoret', fee: 400 },
      { name: 'Thika / Kiambu', fee: 300 },
      { name: 'Machakos', fee: 350 },
      { name: 'Other Kenya Counties', fee: 500 },
      { name: 'Worldwide / Diaspora Shipping', fee: 2500 }
    ];

    const Icon = ({ name, size = 20, className = "" }) => (
      <i data-lucide={name} style={{ width: size, height: size }} class={`inline-block ${className}`}></i>
    );

    function App() {
      // Animated Splash Screen State
      const [showSplash, setShowSplash] = useState(true);

      const [products, setProducts] = useState([]);
      const [cart, setCart] = useState(() => JSON.parse(localStorage.getItem('vee_cart') || '[]'));
      const [loading, setLoading] = useState(true);

      const [activeTab, setActiveTab] = useState('shop');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      
      // Admin Security State
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('vee_admin_logged') === 'true';
      });
      const [adminPasscode, setAdminPasscode] = useState('');
      const [notification, setNotification] = useState(null);

      // Checkout State
      const [checkoutForm, setCheckoutForm] = useState({
        name: '', phone: '', county: COUNTIES[0].name, deliveryAddress: '', paymentMethod: 'mpesa'
      });

      // Product Management Form
      const [productForm, setProductForm] = useState({
        id: '', name: '', price: '', originalPrice: '', category: 'ladies',
        sizes: 'S, M, L, XL', colors: 'Black, White', description: '',
        isNew: true, isSale: false, isAvailable: true, images: []
      });
      const [editingId, setEditingId] = useState(null);
      const [uploadingImage, setUploadingImage] = useState(false);

      // Splash Timeout
      useEffect(() => {
        const timer = setTimeout(() => {
          setShowSplash(false);
        }, 2200);
        return () => clearTimeout(timer);
      }, []);

      // Load Products
      const fetchProducts = async () => {
        setLoading(true);
        if (supabase) {
          const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
          if (!error && data) {
            const mapped = data.map(p => ({
              id: p.id,
              name: p.name,
              price: Number(p.price),
              originalPrice: p.original_price ? Number(p.original_price) : null,
              category: p.category,
              sizes: p.sizes,
              colors: p.colors,
              description: p.description,
              isNew: p.is_new,
              isSale: p.is_sale,
              isAvailable: p.is_available,
              images: p.images || []
            }));
            setProducts(mapped);
          }
        } else {
          const saved = localStorage.getItem('vee_products');
          setProducts(saved ? JSON.parse(saved) : []);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchProducts();
      }, []);

      useEffect(() => {
        localStorage.setItem('vee_cart', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      // Admin Login Handler
      const handleAdminLogin = (e) => {
        if (e) e.preventDefault();
        const inputClean = adminPasscode.trim();
        if (inputClean === 'Briana.2010') {
          setIsAdminLoggedIn(true);
          localStorage.setItem('vee_admin_logged', 'true');
          setAdminPasscode('');
          showToast('Welcome, Vee!');
        } else {
          showToast('Incorrect Admin Password!', 'error');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminLoggedIn(false);
        localStorage.removeItem('vee_admin_logged');
        showToast('Logged out of Admin');
      };

      // Handle Image Upload
      const handleImageUpload = async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        setUploadingImage(true);
        const uploadedUrls = [];

        for (const file of files) {
          if (supabase) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
            const { error } = await supabase.storage.from('product-images').upload(fileName, file);

            if (!error) {
              const { data: publicUrlData } = supabase.storage.from('product-images').getPublicUrl(fileName);
              uploadedUrls.push(publicUrlData.publicUrl);
            } else {
              showToast('Error uploading image to cloud', 'error');
            }
          } else {
            const reader = new FileReader();
            await new Promise((resolve) => {
              reader.onloadend = () => {
                uploadedUrls.push(reader.result);
                resolve();
              };
              reader.readAsDataURL(file);
            });
          }
        }

        setProductForm(prev => ({ ...prev, images: [...prev.images, ...uploadedUrls] }));
        setUploadingImage(false);
        showToast('Image uploaded successfully!');
      };

      // Save / Edit Product
      const handleSaveProduct = async (e) => {
        e.preventDefault();
        if (!productForm.name || !productForm.price) {
          showToast('Product name and price are required', 'error');
          return;
        }

        const fallbackImg = 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=800';
        const finalImages = productForm.images.length > 0 ? productForm.images : [fallbackImg];
        const prodId = editingId || 'vee-' + Date.now();

        const dbPayload = {
          id: prodId,
          name: productForm.name,
          price: Number(productForm.price),
          original_price: productForm.originalPrice ? Number(productForm.originalPrice) : null,
          category: productForm.category,
          sizes: productForm.sizes,
          colors: productForm.colors,
          description: productForm.description,
          is_new: productForm.isNew,
          is_sale: productForm.isSale,
          is_available: productForm.isAvailable,
          images: finalImages
        };

        if (supabase) {
          const { error } = await supabase.from('products').upsert(dbPayload);
          if (error) {
            showToast('Save error: ' + error.message, 'error');
            return;
          }
        } else {
          const updated = editingId 
            ? products.map(p => p.id === editingId ? { ...dbPayload, images: finalImages } : p)
            : [ { ...dbPayload, images: finalImages }, ...products ];
          setProducts(updated);
          localStorage.setItem('vee_products', JSON.stringify(updated));
        }

        fetchProducts();
        showToast(editingId ? 'Product updated live!' : 'Product published to live website!');

        setProductForm({
          id: '', name: '', price: '', originalPrice: '', category: 'ladies',
          sizes: 'S, M, L, XL', colors: 'Black, White', description: '',
          isNew: true, isSale: false, isAvailable: true, images: []
        });
        setEditingId(null);
      };

      const handleDeleteProduct = async (id) => {
        if (!confirm('Are you sure you want to delete this product?')) return;

        if (supabase) {
          await supabase.from('products').delete().eq('id', id);
        } else {
          const filtered = products.filter(p => p.id !== id);
          setProducts(filtered);
          localStorage.setItem('vee_products', JSON.stringify(filtered));
        }
        fetchProducts();
        showToast('Product deleted');
      };

      const handleAddToCart = (product) => {
        if (!product.isAvailable) {
          showToast('Sorry, this item is sold out!', 'error');
          return;
        }
        const cartId = `${product.id}-default`;
        const existing = cart.find(item => item.cartId === cartId);

        if (existing) {
          setCart(cart.map(item => item.cartId === cartId ? { ...item, quantity: item.quantity + 1 } : item));
        } else {
          setCart([...cart, { ...product, cartId, quantity: 1 }]);
        }
        showToast(`Added ${product.name} to bag`);
      };

      const cartTotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);
      const selectedDeliveryFee = useMemo(() => {
        const found = COUNTIES.find(c => c.name === checkoutForm.county);
        return found ? found.fee : 300;
      }, [checkoutForm.county]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
          const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      const handleCheckoutSubmit = async (e) => {
        e.preventDefault();
        if (!checkoutForm.name || !checkoutForm.phone || !checkoutForm.deliveryAddress) {
          showToast('Please complete delivery details', 'error');
          return;
        }

        const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
        const orderData = {
          id: orderId,
          customer_name: checkoutForm.name,
          customer_phone: checkoutForm.phone,
          county: checkoutForm.county,
          delivery_address: checkoutForm.deliveryAddress,
          payment_method: checkoutForm.paymentMethod,
          items: cart,
          subtotal: cartTotal,
          delivery_fee: selectedDeliveryFee,
          total: cartTotal + selectedDeliveryFee,
          status: 'Pending Verification'
        };

        if (supabase) {
          await supabase.from('orders').insert(orderData);
        }

        setCart([]);
        const orderSummary = cart.map(i => `• ${i.name} x${i.quantity} - KSh ${i.price * i.quantity}`).join('%0A');
        const text = `*NEW ORDER - VEE COLLECTION*%0A%0A*Order ID:* ${orderId}%0A*Customer:* ${checkoutForm.name}%0A*Phone:* ${checkoutForm.phone}%0A*Location:* ${checkoutForm.county} (${checkoutForm.deliveryAddress})%0A%0A*Items:*%0A${orderSummary}%0A%0A*Total Amount:* KSh ${(cartTotal + selectedDeliveryFee).toLocaleString()}%0A*Payment Till:* ${DEFAULT_CONFIG.mpesaTill}`;

        window.open(`https://wa.me/${DEFAULT_CONFIG.whatsappNumber}?text=${text}`, '_blank');
        setActiveTab('shop');
        showToast('Order submitted! Redirecting to WhatsApp...');
      };

      return (
        <div class="min-h-screen flex flex-col bg-neutral-950 text-neutral-100 pb-20 md:pb-0">
          
          {/* ELEGANT STYLISH SPLASH SCREEN */}
          {showSplash && (
            <div class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center p-6 text-center select-none">
              <div class="animate-splash space-y-4">
                <div class="w-20 h-20 mx-auto rounded-full bg-gradient-to-tr from-yellow-600 via-yellow-400 to-amber-200 p-[2px] shadow-2xl">
                  <div class="w-full h-full bg-black rounded-full flex items-center justify-center border border-neutral-800">
                    <span class="font-serif text-3xl font-bold text-yellow-400 italic">V</span>
                  </div>
                </div>
                <div>
                  <h1 class="text-3xl md:text-4xl font-bold font-serif tracking-tight text-white">
                    VEE <span class="text-yellow-500 italic">COLLECTION</span>
                  </h1>
                  <div class="h-0.5 w-16 bg-gradient-to-r from-transparent via-yellow-500 to-transparent mx-auto my-3"></div>
                  <p class="text-xs md:text-sm text-neutral-300 tracking-widest uppercase font-light">
                    Your Style, Your Confidence
                  </p>
                </div>
                <div class="pt-6">
                  <div class="w-6 h-6 border-2 border-yellow-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {notification && (
            <div class={`fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border ${notification.type === 'error' ? 'bg-red-950 border-red-500 text-red-200' : 'bg-neutral-900 border-yellow-500 text-yellow-400'}`}>
              <Icon name={notification.type === 'error' ? 'alert-circle' : 'check-circle'} size={18} />
              <span class="font-medium text-xs md:text-sm">{notification.msg}</span>
            </div>
          )}

          {/* Top Banner */}
          <div class="bg-yellow-500 text-black text-[11px] font-semibold py-2 px-4 text-center tracking-wider uppercase flex items-center justify-center gap-2">
            <Icon name="sparkles" size={14} />
            <span>M-Pesa Buy Goods Till: <span class="font-bold underline">{DEFAULT_CONFIG.mpesaTill}</span> | Kenya & Worldwide Delivery</span>
          </div>

          {/* Header */}
          <header class="sticky top-0 z-40 bg-black/95 backdrop-blur-md border-b border-neutral-800">
            <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between gap-4">
              <div class="cursor-pointer" onClick={() => setActiveTab('shop')}>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white font-serif">
                  VEE <span class="text-yellow-500 italic">COLLECTION</span>
                </h1>
                <p class="text-[9px] text-neutral-400 tracking-widest uppercase">{DEFAULT_CONFIG.tagline}</p>
              </div>

              <div class="flex items-center gap-3">
                <a href={`https://wa.me/${DEFAULT_CONFIG.whatsappNumber}`} target="_blank" class="bg-green-600 hover:bg-green-500 text-white p-2 md:px-3 md:py-1.5 rounded-full flex items-center gap-2 text-xs font-medium">
                  <Icon name="message-circle" size={18} />
                  <span class="hidden md:inline">0762089797</span>
                </a>

                <button onClick={() => setActiveTab('cart')} class="relative p-2 bg-neutral-900 border border-neutral-800 rounded-full text-white">
                  <Icon name="shopping-bag" size={20} />
                  {cart.length > 0 && (
                    <span class="absolute -top-1 -right-1 bg-yellow-500 text-black font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center">
                      {cart.reduce((a, b) => a + b.quantity, 0)}
                    </span>
                  )}
                </button>

                <button onClick={() => setActiveTab('admin')} class={`p-2 rounded-full border ${activeTab === 'admin' ? 'bg-yellow-500 text-black border-yellow-500' : 'bg-neutral-900 border-neutral-800 text-neutral-300'}`}>
                  <Icon name="shield" size={20} />
                </button>
              </div>
            </div>

            {/* Category Ribbon */}
            <div class="border-t border-neutral-900 overflow-x-auto no-scrollbar py-2 px-4 bg-neutral-950">
              <div class="flex items-center gap-2 text-xs font-medium whitespace-nowrap">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => { setSelectedCategory(cat.id); setActiveTab('shop'); }}
                    class={`px-3.5 py-1.5 rounded-full transition ${selectedCategory === cat.id && activeTab === 'shop' ? 'bg-yellow-500 text-black font-bold' : 'text-neutral-400 bg-neutral-900'}`}
                  >
                    {cat.name}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-5">

            {/* CATALOG VIEW */}
            {activeTab === 'shop' && (
              <div class="space-y-5">
                
                {/* Search Bar */}
                <div class="flex items-center bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2.5">
                  <Icon name="search" size={18} className="text-neutral-400 mr-2" />
                  <input 
                    type="text" 
                    placeholder="Search dresses, tops, shoes, jackets..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    class="bg-transparent text-xs md:text-sm text-white focus:outline-none w-full"
                  />
                </div>

                {loading ? (
                  <div class="text-center py-20 text-neutral-400 text-xs">
                    <Icon name="loader-2" size={32} className="animate-spin mx-auto text-yellow-500 mb-2" />
                    Loading collection...
                  </div>
                ) : filteredProducts.length === 0 ? (
                  <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-10 text-center max-w-md mx-auto my-8 space-y-3">
                    <Icon name="package-open" size={40} className="mx-auto text-neutral-600" />
                    <h3 class="text-base font-serif font-semibold text-white">No Items Displayed</h3>
                    <p class="text-xs text-neutral-400">Store catalog is empty. Open the Admin Dashboard to add new items directly from your phone gallery.</p>
                    <button onClick={() => setActiveTab('admin')} class="bg-yellow-500 text-black font-semibold px-4 py-2 rounded-xl text-xs">
                      Open Admin Dashboard
                    </button>
                  </div>
                ) : (
                  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
                    {filteredProducts.map(p => (
                      <div key={p.id} class="bg-neutral-900 border border-neutral-800/80 rounded-xl overflow-hidden flex flex-col justify-between">
                        <div class="relative aspect-[3/4] bg-black">
                          <img src={p.images[0]} alt={p.name} class="w-full h-full object-cover" />
                          {!p.isAvailable && <span class="absolute top-2 left-2 bg-red-600 text-white font-bold text-[9px] px-2 py-0.5 rounded">SOLD OUT</span>}
                        </div>
                        <div class="p-3 space-y-2">
                          <h3 class="text-xs font-semibold text-white truncate">{p.name}</h3>
                          <div class="flex items-center justify-between">
                            <span class="text-xs md:text-sm font-bold text-yellow-400">KSh {p.price.toLocaleString()}</span>
                            <button onClick={() => handleAddToCart(p)} disabled={!p.isAvailable} class="p-2 bg-yellow-500 text-black rounded-lg">
                              <Icon name="shopping-bag" size={14} />
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* CART VIEW */}
            {activeTab === 'cart' && (
              <div class="max-w-2xl mx-auto space-y-4">
                <h2 class="text-xl font-serif font-bold text-white border-b border-neutral-800 pb-3">Shopping Bag</h2>
                {cart.length === 0 ? (
                  <div class="text-center py-12 space-y-3">
                    <Icon name="shopping-bag" size={40} className="mx-auto text-neutral-600" />
                    <p class="text-xs text-neutral-400">Your bag is currently empty.</p>
                    <button onClick={() => setActiveTab('shop')} class="bg-yellow-500 text-black font-semibold px-4 py-2 rounded-xl text-xs">
                      Start Shopping
                    </button>
                  </div>
                ) : (
                  <div class="space-y-3">
                    {cart.map(i => (
                      <div key={i.cartId} class="bg-neutral-900 p-3 rounded-xl flex items-center justify-between gap-3 border border-neutral-800">
                        <img src={i.images[0]} class="w-12 h-14 object-cover rounded bg-black" />
                        <div class="flex-1 text-xs">
                          <h4 class="font-bold text-white">{i.name}</h4>
                          <p class="text-yellow-400 font-semibold">KSh {i.price.toLocaleString()} x {i.quantity}</p>
                        </div>
                      </div>
                    ))}
                    <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800 space-y-3">
                      <div class="flex justify-between text-sm font-bold">
                        <span>Total</span>
                        <span class="text-yellow-400">KSh {cartTotal.toLocaleString()}</span>
                      </div>
                      <button onClick={() => setActiveTab('checkout')} class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl text-xs">
                        Proceed To Checkout
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* CHECKOUT VIEW */}
            {activeTab === 'checkout' && (
              <form onSubmit={handleCheckoutSubmit} class="max-w-md mx-auto bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-4 text-xs">
                <h2 class="text-lg font-serif font-bold text-white border-b border-neutral-800 pb-2">Checkout Details</h2>
                <div>
                  <label class="block text-neutral-400 mb-1">Full Name *</label>
                  <input type="text" required value={checkoutForm.name} onChange={e => setCheckoutForm({...checkoutForm, name: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white focus:border-yellow-500 focus:outline-none" placeholder="Enter your full name" />
                </div>
                <div>
                  <label class="block text-neutral-400 mb-1">Phone Number (M-Pesa) *</label>
                  <input type="tel" required value={checkoutForm.phone} onChange={e => setCheckoutForm({...checkoutForm, phone: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white focus:border-yellow-500 focus:outline-none" placeholder="07XXXXXXXX" />
                </div>
                <div>
                  <label class="block text-neutral-400 mb-1">Delivery County *</label>
                  <select value={checkoutForm.county} onChange={e => setCheckoutForm({...checkoutForm, county: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white focus:border-yellow-500 focus:outline-none">
                    {COUNTIES.map(c => <option key={c.name} value={c.name}>{c.name} (+KSh {c.fee})</option>)}
                  </select>
                </div>
                <div>
                  <label class="block text-neutral-400 mb-1">Address / Landmark *</label>
                  <input type="text" required value={checkoutForm.deliveryAddress} onChange={e => setCheckoutForm({...checkoutForm, deliveryAddress: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white focus:border-yellow-500 focus:outline-none" placeholder="House/Street, Landmark" />
                </div>
                <button type="submit" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl">
                  Complete Order via WhatsApp
                </button>
              </form>
            )}

            {/* ADMIN DASHBOARD VIEW */}
            {activeTab === 'admin' && (
              <div class="max-w-2xl mx-auto space-y-6">
                {!isAdminLoggedIn ? (
                  <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl text-center space-y-4">
                    <Icon name="shield-lock" size={36} className="mx-auto text-yellow-500" />
                    <h3 class="text-base font-bold text-white font-serif">Vee Collection Admin</h3>
                    <p class="text-xs text-neutral-400">Restricted Access. Enter secret password to manage products.</p>
                    
                    <form onSubmit={handleAdminLogin} class="space-y-3">
                      <input 
                        type="password" 
                        placeholder="Enter Admin Password" 
                        value={adminPasscode} 
                        onChange={e => setAdminPasscode(e.target.value)} 
                        class="w-full bg-black border border-neutral-800 p-3 text-center text-xs rounded-xl text-white focus:border-yellow-500 focus:outline-none" 
                        autoFocus
                      />
                      <button 
                        type="submit"
                        class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl text-xs hover:bg-yellow-400 transition"
                      >
                        Login To Dashboard
                      </button>
                    </form>
                  </div>
                ) : (
                  <div class="space-y-6">
                    <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
                      <h2 class="text-lg font-bold text-white font-serif">Store Dashboard</h2>
                      <button onClick={handleAdminLogout} class="text-xs text-neutral-400 hover:text-red-400 underline">Logout</button>
                    </div>

                    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-4 text-xs">
                      <h3 class="font-bold text-yellow-400 text-sm">Upload Clothing Item</h3>
                      <form onSubmit={handleSaveProduct} class="space-y-3">
                        <input type="text" placeholder="Product Title *" required value={productForm.name} onChange={e => setProductForm({...productForm, name: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white" />
                        <div class="grid grid-cols-2 gap-2">
                          <input type="number" placeholder="Price (KSh) *" required value={productForm.price} onChange={e => setProductForm({...productForm, price: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white" />
                          <select value={productForm.category} onChange={e => setProductForm({...productForm, category: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white">
                            {CATEGORIES.filter(c => c.id !== 'all').map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                          </select>
                        </div>
                        <div>
                          <label class="block text-neutral-400 mb-1">Select Pictures from Phone Gallery *</label>
                          <input type="file" multiple accept="image/*" onChange={handleImageUpload} class="w-full bg-black border border-neutral-800 p-2 rounded-xl text-neutral-400 file:mr-2 file:py-1 file:px-2 file:bg-yellow-500 file:text-black file:rounded-lg file:text-xs" />
                          {uploadingImage && <p class="text-yellow-400 text-[10px] mt-1">Uploading picture...</p>}
                        </div>
                        <button type="submit" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl text-xs">
                          Publish To Live Website
                        </button>
                      </form>
                    </div>

                    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                      <h3 class="font-bold text-white text-xs">Live Inventory ({products.length})</h3>
                      <div class="divide-y divide-neutral-800 text-xs">
                        {products.map(p => (
                          <div key={p.id} class="py-2.5 flex items-center justify-between">
                            <span class="text-white font-medium">{p.name} - KSh {p.price.toLocaleString()}</span>
                            <button onClick={() => handleDeleteProduct(p.id)} class="text-red-400 underline">Delete</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-black/95 backdrop-blur-lg border-t border-neutral-800 z-40 px-6 py-2 flex items-center justify-between text-[10px] font-medium text-neutral-400">
            <button onClick={() => setActiveTab('shop')} class={`flex flex-col items-center gap-1 ${activeTab === 'shop' ? 'text-yellow-400 font-bold' : ''}`}>
              <Icon name="store" size={18} />
              <span>Shop</span>
            </button>
            <button onClick={() => { setActiveTab('shop'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} class="flex flex-col items-center gap-1">
              <Icon name="grid" size={18} />
              <span>Categories</span>
            </button>
            <button onClick={() => setActiveTab('cart')} class={`flex flex-col items-center gap-1 relative ${activeTab === 'cart' ? 'text-yellow-400 font-bold' : ''}`}>
              <Icon name="shopping-bag" size={18} />
              <span>Bag</span>
              {cart.length > 0 && (
                <span class="absolute -top-1 right-2 bg-yellow-500 text-black font-bold text-[9px] w-3.5 h-3.5 rounded-full flex items-center justify-center">
                  {cart.length}
                </span>
              )}
            </button>
            <button onClick={() => setActiveTab('admin')} class={`flex flex-col items-center gap-1 ${activeTab === 'admin' ? 'text-yellow-400 font-bold' : ''}`}>
              <Icon name="shield" size={18} />
              <span>Admin</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
