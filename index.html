<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vee Collection | Your Style, Your Confidence</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { 400: '#D4AF37', 500: '#C5A028', 600: '#B08D1E' },
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #050505; color: #f3f4f6; }
    h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #121212; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
  </style>
</head>
<body class="bg-black text-gray-100 min-h-screen selection:bg-yellow-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_CONFIG = {
      whatsappNumber: '254762089797',
      displayPhone: '0762089797',
      mpesaTill: '8221168',
      storeName: 'Vee Collection',
      tagline: 'Your Style, Your Confidence.'
    };

    const CATEGORIES = [
      { id: 'all', name: 'All Collection' },
      { id: 'ladies', name: "Ladies' Clothes" },
      { id: 'dresses', name: 'Dresses' },
      { id: 'tops', name: 'Tops & Blouses' },
      { id: 'trousers', name: 'Trousers & Jeans' },
      { id: 'skirts', name: 'Skirts' },
      { id: 'jackets', name: 'Jackets & Sweaters' },
      { id: 'men', name: "Men's Clothing" },
      { id: 'children', name: "Children's Clothing" },
      { id: 'shoes-accessories', name: 'Shoes & Accessories' }
    ];

    const Icon = ({ name, size = 20, className = "" }) => (
      <i data-lucide={name} style={{ width: size, height: size }} class={`inline-block ${className}`}></i>
    );

    // Image compression helper
    const compressImage = (file, callback) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 600;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.65));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    function App() {
      // Products stored in localStorage
      const [products, setProducts] = useState(() => {
        try {
          const saved = localStorage.getItem('vee_products_v6');
          return saved ? JSON.parse(saved) : [];
        } catch(e) {
          return [];
        }
      });

      // Cart state
      const [cart, setCart] = useState(() => {
        try {
          const saved = localStorage.getItem('vee_cart_v6');
          return saved ? JSON.parse(saved) : [];
        } catch(e) {
          return [];
        }
      });

      const [activeTab, setActiveTab] = useState('shop');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [selectedSizes, setSelectedSizes] = useState({});

      // Admin Authentication
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
        return localStorage.getItem('vee_admin_logged') === 'true';
      });
      const [adminPasscode, setAdminPasscode] = useState('');
      const [notification, setNotification] = useState(null);

      // Customer Checkout Form
      const [checkoutForm, setCheckoutForm] = useState({
        name: '', phone: '', deliveryAddress: '', paymentMethod: 'mpesa'
      });

      // Admin Product Form
      const [productForm, setProductForm] = useState({
        id: '', name: '', price: '', originalPrice: '', category: 'ladies',
        sizes: 'S, M, L, XL', colors: 'Black, White, Gold', description: '',
        isAvailable: true, images: []
      });
      const [editingId, setEditingId] = useState(null);

      useEffect(() => {
        try {
          localStorage.setItem('vee_products_v6', JSON.stringify(products));
        } catch(e) {
          console.error("LocalStorage error", e);
        }
      }, [products]);

      useEffect(() => {
        try {
          localStorage.setItem('vee_cart_v6', JSON.stringify(cart));
        } catch(e) {}
      }, [cart]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const showToast = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      const handleAdminLogin = (e) => {
        if (e) e.preventDefault();
        if (adminPasscode.trim() === 'Briana.2010') {
          setIsAdminLoggedIn(true);
          localStorage.setItem('vee_admin_logged', 'true');
          setAdminPasscode('');
          showToast('Welcome, Vee!');
        } else {
          showToast('Incorrect Admin Password!', 'error');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminLoggedIn(false);
        localStorage.removeItem('vee_admin_logged');
        showToast('Logged out of Admin');
      };

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        files.forEach(file => {
          compressImage(file, (compressedData) => {
            setProductForm(prev => ({ ...prev, images: [...prev.images, compressedData] }));
          });
        });
        showToast('Picture uploaded and optimized!');
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        if (!productForm.name || !productForm.price) {
          showToast('Product name and price are required', 'error');
          return;
        }

        const fallbackImg = 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&q=80&w=800';
        const finalImages = productForm.images.length > 0 ? productForm.images : [fallbackImg];
        const prodId = editingId || 'ITEM-' + Math.floor(1000 + Math.random() * 9000);

        const newProduct = {
          id: prodId,
          name: productForm.name,
          price: Number(productForm.price),
          originalPrice: productForm.originalPrice ? Number(productForm.originalPrice) : null,
          category: productForm.category,
          sizes: productForm.sizes || 'Free Size',
          colors: productForm.colors || 'Standard',
          description: productForm.description,
          isAvailable: productForm.isAvailable,
          images: finalImages
        };

        if (editingId) {
          setProducts(products.map(p => p.id === editingId ? newProduct : p));
          showToast('Product updated on live store!');
        } else {
          setProducts([newProduct, ...products]);
          showToast('Product published to live store!');
        }

        setProductForm({
          id: '', name: '', price: '', originalPrice: '', category: 'ladies',
          sizes: 'S, M, L, XL', colors: 'Black, White, Gold', description: '',
          isAvailable: true, images: []
        });
        setEditingId(null);
      };

      const handleToggleSoldOut = (product) => {
        const updatedStatus = !product.isAvailable;
        const updated = products.map(p => p.id === product.id ? { ...p, isAvailable: updatedStatus } : p);
        setProducts(updated);
        showToast(updatedStatus ? `${product.name} is now In Stock!` : `${product.name} marked as Sold Out!`);
      };

      const handleDeleteProduct = (id) => {
        if (confirm('Delete this product permanently?')) {
          setProducts(products.filter(p => p.id !== id));
          showToast('Product deleted');
        }
      };

      const handleSelectSize = (productId, size) => {
        setSelectedSizes(prev => ({ ...prev, [productId]: size }));
      };

      const handleAddToCart = (product) => {
        if (!product.isAvailable) {
          showToast('Sorry, this item is sold out!', 'error');
          return;
        }

        const availableSizes = product.sizes ? product.sizes.split(',').map(s => s.trim()) : ['Free Size'];
        const chosenSize = selectedSizes[product.id] || availableSizes[0];
        
        const cartItemId = `${product.id}-${chosenSize}`;
        const existingItem = cart.find(item => item.cartItemId === cartItemId);

        if (existingItem) {
          setCart(cart.map(item => item.cartItemId === cartItemId ? { ...item, quantity: item.quantity + 1 } : item));
        } else {
          setCart([...cart, { 
            ...product, 
            cartItemId, 
            chosenSize, 
            quantity: 1 
          }]);
        }
        showToast(`Added ${product.name} (${chosenSize}) to shopping bag!`);
      };

      const handleUpdateQuantity = (cartItemId, change) => {
        setCart(cart.map(item => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.quantity + change;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const handleRemoveFromCart = (cartItemId) => {
        setCart(cart.filter(item => item.cartItemId !== cartItemId));
        showToast('Item removed from bag');
      };

      const cartTotal = useMemo(() => cart.reduce((sum, item) => sum + (item.price * item.quantity), 0), [cart]);
      const cartItemCount = useMemo(() => cart.reduce((count, item) => count + item.quantity, 0), [cart]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
          const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                p.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                p.sizes.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [products, selectedCategory, searchQuery]);

      const handleCheckoutSubmit = (e) => {
        e.preventDefault();
        if (cart.length === 0) {
          showToast('Your shopping bag is empty!', 'error');
          return;
        }
        if (!checkoutForm.name || !checkoutForm.phone || !checkoutForm.deliveryAddress) {
          showToast('Please complete delivery details', 'error');
          return;
        }

        const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
        
        const itemsList = cart.map((item, index) => 
          `${index + 1}. *${item.name}* (ID: ${item.id})%0A   • Size: ${item.chosenSize}%0A   • Qty: ${item.quantity} x KSh ${item.price.toLocaleString()}%0A   • Total: KSh ${(item.price * item.quantity).toLocaleString()}`
        ).join('%0A%0A');

        const text = `*NEW ORDER - VEE COLLECTION*%0A%0A` +
          `*Order ID:* ${orderId}%0A` +
          `*Customer Name:* ${checkoutForm.name}%0A` +
          `*Phone Number:* ${checkoutForm.phone}%0A` +
          `*Delivery Address:* ${checkoutForm.deliveryAddress}%0A%0A` +
          `*SELECTED ITEMS (${cartItemCount}):*%0A${itemsList}%0A%0A` +
          `---------------------------%0A` +
          `*TOTAL PAYABLE:* KSh ${cartTotal.toLocaleString()}%0A` +
          `*M-Pesa Buy Goods Till:* ${DEFAULT_CONFIG.mpesaTill}%0A%0A` +
          `_Note: Delivery fee will be discussed and agreed directly via WhatsApp._`;

        window.open(`https://wa.me/${DEFAULT_CONFIG.whatsappNumber}?text=${text}`, '_blank');
        setCart([]);
        setActiveTab('shop');
        showToast('Order submitted! Opening WhatsApp...');
      };

      return (
        <div class="min-h-screen flex flex-col bg-neutral-950 text-neutral-100">
          
          {/* Toast Notification */}
          {notification && (
            <div class={`fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border ${notification.type === 'error' ? 'bg-red-950 border-red-500 text-red-200' : 'bg-neutral-900 border-yellow-500 text-yellow-400'}`}>
              <Icon name={notification.type === 'error' ? 'alert-circle' : 'check-circle'} size={18} />
              <span class="font-medium text-xs md:text-sm">{notification.msg}</span>
            </div>
          )}

          {/* Top Announcement Bar */}
          <div class="bg-yellow-500 text-black text-xs font-semibold py-2 px-4 text-center tracking-wider uppercase flex items-center justify-center gap-2">
            <Icon name="truck" size={14} />
            <span>Delivery Available Country Wide | M-Pesa Buy Goods Till: <span class="font-bold underline">{DEFAULT_CONFIG.mpesaTill}</span></span>
          </div>

          {/* Website Header */}
          <header class="sticky top-0 z-40 bg-black/95 backdrop-blur-md border-b border-neutral-800">
            <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
              <div class="cursor-pointer" onClick={() => setActiveTab('shop')}>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white font-serif">
                  VEE <span class="text-yellow-500 italic">COLLECTION</span>
                </h1>
                <p class="text-[10px] text-neutral-400 tracking-widest uppercase">{DEFAULT_CONFIG.tagline}</p>
              </div>

              <div class="flex items-center gap-3 md:gap-4">
                <a href={`https://wa.me/${DEFAULT_CONFIG.whatsappNumber}`} target="_blank" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-full flex items-center gap-2 text-xs font-semibold shadow transition">
                  <Icon name="message-circle" size={16} />
                  <span class="hidden sm:inline">{DEFAULT_CONFIG.displayPhone}</span>
                </a>

                <button 
                  onClick={() => setActiveTab('cart')} 
                  class="relative p-2.5 bg-neutral-900 border border-neutral-800 rounded-full text-white hover:border-yellow-500 transition flex items-center gap-2"
                >
                  <Icon name="shopping-bag" size={20} />
                  {cartItemCount > 0 && (
                    <span class="bg-yellow-500 text-black font-bold text-[11px] px-2 py-0.5 rounded-full">
                      {cartItemCount}
                    </span>
                  )}
                </button>

                <button onClick={() => setActiveTab('admin')} class={`p-2.5 rounded-full border transition ${activeTab === 'admin' ? 'bg-yellow-500 text-black border-yellow-500' : 'bg-neutral-900 border-neutral-800 text-neutral-300'}`}>
                  <Icon name="shield" size={20} />
                </button>
              </div>
            </div>

            {/* Category Ribbon */}
            <div class="border-t border-neutral-900 overflow-x-auto no-scrollbar py-2.5 px-4 bg-neutral-950">
              <div class="max-w-7xl mx-auto flex items-center gap-2 text-xs font-medium whitespace-nowrap">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => { setSelectedCategory(cat.id); setActiveTab('shop'); }}
                    class={`px-4 py-2 rounded-full transition ${selectedCategory === cat.id && activeTab === 'shop' ? 'bg-yellow-500 text-black font-bold' : 'text-neutral-400 bg-neutral-900 hover:text-white'}`}
                  >
                    {cat.name}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Main Website Content */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">

            {/* SHOP CATALOG VIEW */}
            {activeTab === 'shop' && (
              <div class="space-y-6">
                
                <div class="flex flex-col md:flex-row gap-4 items-center justify-between bg-neutral-900/60 p-4 rounded-2xl border border-neutral-800">
                  <div class="flex items-center gap-2 text-xs text-yellow-400 font-medium">
                    <Icon name="check-circle" size={16} />
                    <span>Select multiple items to your bag and pay once!</span>
                  </div>

                  {/* Search Bar */}
                  <div class="flex items-center bg-black border border-neutral-800 rounded-xl px-4 py-2 w-full md:w-80">
                    <Icon name="search" size={18} className="text-neutral-400 mr-2" />
                    <input 
                      type="text" 
                      placeholder="Search name, Item ID, sizes..." 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="bg-transparent text-xs text-white focus:outline-none w-full"
                    />
                  </div>
                </div>

                {filteredProducts.length === 0 ? (
                  <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center max-w-md mx-auto my-8 space-y-4">
                    <Icon name="package-open" size={48} className="mx-auto text-neutral-600" />
                    <h3 class="text-lg font-serif font-semibold text-white">No Items Listed Yet</h3>
                    <p class="text-xs text-neutral-400">Your store catalog is empty. Open the Admin Dashboard to post your first clothing item along with sizes!</p>
                    <button onClick={() => setActiveTab('admin')} class="bg-yellow-500 text-black font-semibold px-5 py-2.5 rounded-xl text-xs hover:bg-yellow-400 transition">
                      Go To Admin Dashboard
                    </button>
                  </div>
                ) : (
                  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                    {filteredProducts.map(p => {
                      const availableSizes = p.sizes ? p.sizes.split(',').map(s => s.trim()) : ['Free Size'];
                      const currentSelectedSize = selectedSizes[p.id] || availableSizes[0];

                      return (
                        <div key={p.id} class="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden flex flex-col justify-between group hover:border-yellow-500/50 transition">
                          <div class="relative aspect-[3/4] bg-black overflow-hidden">
                            <img src={p.images[0]} alt={p.name} class="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                            
                            {/* Item ID Tag */}
                            <span class="absolute top-2 right-2 bg-black/80 text-yellow-400 font-mono text-[9px] px-2 py-0.5 rounded border border-neutral-800">
                              ID: {p.id}
                            </span>

                            {!p.isAvailable && (
                              <span class="absolute top-2 left-2 bg-red-600 text-white font-bold text-[10px] px-2.5 py-0.5 rounded shadow">
                                SOLD OUT
                              </span>
                            )}
                          </div>

                          <div class="p-3.5 space-y-3 flex-1 flex flex-col justify-between">
                            <div>
                              <div class="flex items-center justify-between">
                                <span class="text-[10px] text-yellow-500 uppercase font-semibold">
                                  {CATEGORIES.find(c => c.id === p.category)?.name}
                                </span>
                              </div>
                              <h3 class="text-xs md:text-sm font-semibold text-white truncate">{p.name}</h3>
                              
                              {/* Interactive Size Selector */}
                              <div class="mt-2 space-y-1">
                                <label class="text-[10px] text-neutral-400 block">Select Size:</label>
                                <div class="flex items-center gap-1 flex-wrap">
                                  {availableSizes.map((sz, idx) => (
                                    <button
                                      key={idx}
                                      onClick={() => handleSelectSize(p.id, sz)}
                                      class={`text-[10px] px-2 py-0.5 rounded border transition ${currentSelectedSize === sz ? 'bg-yellow-500 text-black font-bold border-yellow-500' : 'bg-neutral-800 text-neutral-300 border-neutral-700 hover:border-neutral-500'}`}
                                    >
                                      {sz}
                                    </button>
                                  ))}
                                </div>
                              </div>
                            </div>

                            <div class="flex items-center justify-between pt-2 border-t border-neutral-800">
                              <div>
                                <span class="text-xs md:text-sm font-bold text-yellow-400">KSh {p.price.toLocaleString()}</span>
                              </div>
                              <button 
                                onClick={() => handleAddToCart(p)} 
                                disabled={!p.isAvailable} 
                                class={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 ${p.isAvailable ? 'bg-yellow-500 text-black hover:bg-yellow-400' : 'bg-neutral-800 text-neutral-500 cursor-not-allowed'}`}
                              >
                                <Icon name="shopping-bag" size={14} />
                                <span>Add to Bag</span>
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* CART / SHOPPING BAG VIEW */}
            {activeTab === 'cart' && (
              <div class="max-w-3xl mx-auto space-y-6">
                <div class="flex items-center justify-between border-b border-neutral-800 pb-4">
                  <h2 class="text-2xl font-serif font-bold text-white">Your Shopping Bag ({cartItemCount} items)</h2>
                  {cart.length > 0 && (
                    <button onClick={() => setCart([])} class="text-xs text-red-400 hover:underline">
                      Clear Bag
                    </button>
                  )}
                </div>

                {cart.length === 0 ? (
                  <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-12 text-center space-y-4">
                    <Icon name="shopping-bag" size={48} className="mx-auto text-neutral-600" />
                    <h3 class="text-lg font-serif font-semibold text-white">Your Shopping Bag is Empty</h3>
                    <p class="text-xs text-neutral-400">You haven't added any clothes to your bag yet.</p>
                    <button onClick={() => setActiveTab('shop')} class="bg-yellow-500 text-black font-semibold px-6 py-2.5 rounded-xl text-xs hover:bg-yellow-400 transition">
                      Start Shopping
                    </button>
                  </div>
                ) : (
                  <div class="space-y-4">
                    <div class="space-y-3">
                      {cart.map(item => (
                        <div key={item.cartItemId} class="bg-neutral-900 border border-neutral-800 p-4 rounded-xl flex items-center justify-between gap-4">
                          <img src={item.images[0]} alt={item.name} class="w-16 h-20 object-cover rounded-lg bg-black" />
                          
                          <div class="flex-1 text-xs space-y-1">
                            <span class="text-[10px] text-yellow-500 font-mono">ID: {item.id}</span>
                            <h4 class="font-bold text-white text-sm">{item.name}</h4>
                            <p class="text-neutral-400">Size: <strong class="text-yellow-400">{item.chosenSize}</strong></p>
                            <p class="text-yellow-400 font-bold">KSh {item.price.toLocaleString()} each</p>
                          </div>

                          <div class="flex items-center gap-2 bg-black border border-neutral-800 rounded-lg p-1">
                            <button onClick={() => handleUpdateQuantity(item.cartItemId, -1)} class="w-6 h-6 flex items-center justify-center text-neutral-300 hover:text-white font-bold">-</button>
                            <span class="text-xs font-bold px-2">{item.quantity}</span>
                            <button onClick={() => handleUpdateQuantity(item.cartItemId, 1)} class="w-6 h-6 flex items-center justify-center text-neutral-300 hover:text-white font-bold">+</button>
                          </div>

                          <div class="text-right space-y-1">
                            <p class="text-sm font-bold text-white">KSh {(item.price * item.quantity).toLocaleString()}</p>
                            <button onClick={() => handleRemoveFromCart(item.cartItemId)} class="text-[10px] text-red-400 hover:underline">
                              Remove
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl space-y-4">
                      <h3 class="font-serif font-bold text-white text-lg">Bag Total Summary</h3>
                      
                      <div class="space-y-2 text-xs border-b border-neutral-800 pb-3">
                        <div class="flex justify-between text-neutral-300">
                          <span>Items Total ({cartItemCount} items)</span>
                          <span class="font-bold text-white">KSh {cartTotal.toLocaleString()}</span>
                        </div>
                        <div class="flex justify-between text-neutral-400">
                          <span>Delivery Fee</span>
                          <span class="text-yellow-400 italic">To be agreed on WhatsApp</span>
                        </div>
                      </div>

                      <div class="flex justify-between text-base font-bold">
                        <span>Items Subtotal</span>
                        <span class="text-yellow-400">KSh {cartTotal.toLocaleString()}</span>
                      </div>

                      <button onClick={() => setActiveTab('checkout')} class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 rounded-xl text-sm transition">
                        Proceed to Checkout ({cartItemCount} Items)
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* CHECKOUT VIEW */}
            {activeTab === 'checkout' && (
              <div class="max-w-xl mx-auto space-y-6">
                <button onClick={() => setActiveTab('cart')} class="text-xs text-neutral-400 hover:text-white flex items-center gap-1">
                  ← Back to Shopping Bag
                </button>

                <form onSubmit={handleCheckoutSubmit} class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl space-y-5 text-xs">
                  <h2 class="text-lg font-serif font-bold text-white border-b border-neutral-800 pb-3">Customer Order Details</h2>

                  {/* Cart Items Summary List */}
                  <div class="bg-black/60 border border-neutral-800 p-4 rounded-xl space-y-2">
                    <p class="font-bold text-yellow-400">Selected Items ({cart.length} types, {cartItemCount} total):</p>
                    <div class="divide-y divide-neutral-800">
                      {cart.map(item => (
                        <div key={item.cartItemId} class="py-1.5 flex justify-between text-neutral-300">
                          <span>{item.name} <strong class="text-yellow-500">(ID: {item.id})</strong> - Size: {item.chosenSize} x{item.quantity}</span>
                          <span class="font-bold text-white">KSh {(item.price * item.quantity).toLocaleString()}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Customer Delivery Form */}
                  <div class="space-y-3">
                    <div>
                      <label class="block text-neutral-400 mb-1">Full Name *</label>
                      <input type="text" required value={checkoutForm.name} onChange={e => setCheckoutForm({...checkoutForm, name: e.target.value})} class="w-full bg-black border border-neutral-800 p-3 rounded-xl text-white focus:border-yellow-500 focus:outline-none" placeholder="Enter your full name" />
                    </div>
                    <div>
                      <label class="block text-neutral-400 mb-1">Phone Number (M-Pesa) *</label>
                      <input type="tel" required value={checkoutForm.phone} onChange={e => setCheckoutForm({...checkoutForm, phone: e.target.value})} class="w-full bg-black border border-neutral-800 p-3 rounded-xl text-white focus:border-yellow-500 focus:outline-none" placeholder="07XXXXXXXX" />
                    </div>
                    <div>
                      <label class="block text-neutral-400 mb-1">Delivery Address / Landmark *</label>
                      <input type="text" required value={checkoutForm.deliveryAddress} onChange={e => setCheckoutForm({...checkoutForm, deliveryAddress: e.target.value})} class="w-full bg-black border border-neutral-800 p-3 rounded-xl text-white focus:border-yellow-500 focus:outline-none" placeholder="e.g. Town, Estate, House/Street" />
                    </div>
                  </div>

                  {/* M-Pesa Payment Box */}
                  <div class="bg-green-950/40 border border-green-800 p-4 rounded-xl space-y-2">
                    <p class="font-bold text-green-400 text-xs flex items-center gap-2">
                      <Icon name="credit-card" size={16} /> M-Pesa Payment Details
                    </p>
                    <p class="text-neutral-300">
                      1. Go to M-Pesa &gt; Lipa na M-Pesa &gt; Buy Goods and Services<br/>
                      2. Enter Till Number: <strong class="text-yellow-400 text-sm">{DEFAULT_CONFIG.mpesaTill}</strong><br/>
                      3. Items Total: <strong class="text-yellow-400 text-sm">KSh {cartTotal.toLocaleString()}</strong><br/>
                      <span class="text-[11px] text-neutral-400">* Delivery fee will be discussed directly with you on WhatsApp.</span>
                    </p>
                  </div>

                  <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 rounded-xl text-sm transition">
                    Submit Order via WhatsApp
                  </button>
                </form>
              </div>
            )}

            {/* ADMIN DASHBOARD VIEW */}
            {activeTab === 'admin' && (
              <div class="max-w-2xl mx-auto space-y-6">
                {!isAdminLoggedIn ? (
                  <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-2xl text-center space-y-4">
                    <Icon name="shield-lock" size={40} className="mx-auto text-yellow-500" />
                    <h3 class="text-lg font-bold text-white font-serif">Vee Collection Admin</h3>
                    <p class="text-xs text-neutral-400">Enter password to manage clothing items and view Item IDs.</p>
                    
                    <form onSubmit={handleAdminLogin} class="space-y-3">
                      <input 
                        type="password" 
                        placeholder="Enter Admin Password" 
                        value={adminPasscode} 
                        onChange={e => setAdminPasscode(e.target.value)} 
                        class="w-full bg-black border border-neutral-800 p-3 text-center text-xs rounded-xl text-white focus:border-yellow-500 focus:outline-none" 
                      />
                      <button 
                        type="submit"
                        class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl text-xs hover:bg-yellow-400 transition"
                      >
                        Login To Admin
                      </button>
                    </form>
                  </div>
                ) : (
                  <div class="space-y-6">
                    <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
                      <h2 class="text-xl font-bold text-white font-serif">Store Inventory Management</h2>
                      <button onClick={handleAdminLogout} class="text-xs text-neutral-400 hover:text-red-400 underline">Logout</button>
                    </div>

                    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-4 text-xs">
                      <h3 class="font-bold text-yellow-400 text-sm">
                        {editingId ? 'Edit Product' : 'Upload New Clothing Item'}
                      </h3>
                      <form onSubmit={handleSaveProduct} class="space-y-3">
                        <div>
                          <label class="block text-neutral-400 mb-1">Product Title *</label>
                          <input type="text" placeholder="e.g. Elegant Satin Evening Dress" required value={productForm.name} onChange={e => setProductForm({...productForm, name: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white" />
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                          <div>
                            <label class="block text-neutral-400 mb-1">Price (KSh) *</label>
                            <input type="number" placeholder="3500" required value={productForm.price} onChange={e => setProductForm({...productForm, price: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white" />
                          </div>
                          <div>
                            <label class="block text-neutral-400 mb-1">Category *</label>
                            <select value={productForm.category} onChange={e => setProductForm({...productForm, category: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white">
                              {CATEGORIES.filter(c => c.id !== 'all').map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                          </div>
                        </div>

                        {/* Dedicated Sizes Input */}
                        <div>
                          <label class="block text-neutral-400 mb-1">Available Sizes (Separated by comma) *</label>
                          <input type="text" placeholder="S, M, L, XL, XXL, 38, 40 or Free Size" required value={productForm.sizes} onChange={e => setProductForm({...productForm, sizes: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white" />
                        </div>

                        {/* Colors Input */}
                        <div>
                          <label class="block text-neutral-400 mb-1">Available Colors</label>
                          <input type="text" placeholder="Black, White, Gold, Red" value={productForm.colors} onChange={e => setProductForm({...productForm, colors: e.target.value})} class="w-full bg-black border border-neutral-800 p-2.5 rounded-xl text-white" />
                        </div>

                        {/* Stock Availability Toggle */}
                        <div class="pt-1">
                          <label class="flex items-center gap-2 cursor-pointer bg-black p-2.5 rounded-xl border border-neutral-800">
                            <input 
                              type="checkbox" 
                              checked={productForm.isAvailable} 
                              onChange={e => setProductForm({...productForm, isAvailable: e.target.checked})} 
                              class="accent-yellow-500 w-4 h-4"
                            />
                            <span class="text-white font-medium">In Stock / Available for Sale</span>
                          </label>
                        </div>

                        <div>
                          <label class="block text-neutral-400 mb-1">Select Pictures from Phone Gallery *</label>
                          <input type="file" multiple accept="image/*" onChange={handleImageUpload} class="w-full bg-black border border-neutral-800 p-2 rounded-xl text-neutral-400 file:mr-2 file:py-1 file:px-2 file:bg-yellow-500 file:text-black file:rounded-lg file:text-xs cursor-pointer" />
                        </div>

                        <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 rounded-xl text-xs transition">
                          {editingId ? 'Save Product Changes' : 'Post Product To Store'}
                        </button>
                      </form>
                    </div>

                    {/* Inventory List with Visible Item IDs */}
                    <div class="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl space-y-3">
                      <h3 class="font-bold text-white text-xs">Live Inventory ({products.length} Items)</h3>
                      <div class="divide-y divide-neutral-800 text-xs">
                        {products.map(p => (
                          <div key={p.id} class="py-3 flex items-center justify-between gap-2">
                            <div>
                              <div class="flex items-center gap-2">
                                <span class="text-[10px] bg-black text-yellow-400 font-mono px-2 py-0.5 rounded border border-neutral-800 font-bold">
                                  ID: {p.id}
                                </span>
                                <p class="text-white font-medium">{p.name}</p>
                              </div>
                              <p class="text-[10px] text-neutral-400 mt-0.5">
                                KSh {p.price.toLocaleString()} | Sizes: {p.sizes}
                              </p>
                            </div>
                            
                            <div class="flex items-center gap-2">
                              <button 
                                onClick={() => handleToggleSoldOut(p)} 
                                class={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition ${p.isAvailable ? 'bg-green-950 text-green-300 border border-green-800' : 'bg-red-950 text-red-300 border border-red-800'}`}
                              >
                                {p.isAvailable ? 'In Stock' : 'Sold Out'}
                              </button>

                              <button onClick={() => handleDeleteProduct(p.id)} class="text-red-400 underline text-[11px]">
                                Delete
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Website Footer */}
          <footer class="border-t border-neutral-900 bg-black py-8 text-xs text-neutral-500 mt-12">
            <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
              <p class="font-serif text-sm font-bold text-white tracking-widest uppercase">VEE COLLECTION</p>
              <p>Your Style, Your Confidence. | Kenya & Worldwide</p>
              <p class="text-[10px] text-neutral-600">Customer Support: +254 762 089 797 | Buy Goods Till: 8221168</p>
              <p class="text-[10px] text-neutral-700">© 2026 Vee Collection. All rights reserved.</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
